name: Vitality
kind: company
description: >-
  Vitality is a United Kingdom health and life insurer, operating as VitalityHealth
  and VitalityLife under the Vitality umbrella brand and owned by the South African
  financial services group Discovery Limited. Formed from the 2004 PruHealth joint
  venture with Prudential and the 2010 acquisition of Standard Life Healthcare, and
  rebranded to Vitality in 2014, it is the UK's third-largest private medical insurer
  behind Bupa and AXA, with roughly 1.9 million members and a shared-value model that
  prices private medical insurance, life cover and protection against member health
  and activity engagement. Its lines of business are private medical insurance, life
  insurance and protection, and workplace/employee benefits distributed through
  intermediaries, employee benefit consultants and bank partnerships rather than
  direct developer channels. Vitality's API posture is partner-gated and undocumented
  in public: it has modernised onto a WSO2 API Manager platform to decouple core
  policy and member services from front-end applications and to shorten partner
  onboarding, and it runs a publicly resolvable production API gateway at
  apis.vitality.co.uk, but it publishes no self-serve developer portal, no API
  reference, no OpenAPI or Swagger definitions and no public quote, bind, issue or
  FNOL endpoints. Credentials are issued through commercial partner onboarding and
  the gateway's OAuth2 client-credentials token endpoint rejects anonymous callers.
  There is no public ACORD, AL3 or NGDS reference for the UK entity, which is
  consistent with a life-and-health carrier in a market where ACORD adoption is
  concentrated in the London subscription market rather than in retail health and
  protection.
