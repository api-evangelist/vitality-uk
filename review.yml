sources:
- url: https://apis.vitality.co.uk/
  type: APIGateway
  note: Live WSO2 API Manager production gateway; response headers expose origin host
    wso2-prd-apigw.tvc.vitality.co.uk on port 8243.
- url: https://www.vitality.co.uk/
  type: Website
  note: Corporate marketing site; Cloudflare-protected, 403 to non-browser clients.
- url: https://github.com/VitalityUK
  type: GitHubOrganization
  note: Confirmed via GitHub API; zero public repositories.
- url: https://fintech.global/2025/08/20/vitality-accelerates-digital-transformation-with-wso2-api-gateway/
  type: Press
  note: Vitality deployed WSO2 open-source API Manager and integration tooling; partner
    onboarding reduced from six months to a few weeks.
- url: https://insurtechdigital.com/news/vitality-cuts-partner-onboarding-from-six-months-to-weeks
  type: Press
  note: Corroborates the WSO2 API platform and the partner-onboarding improvement.
- url: https://en.wikipedia.org/wiki/Vitality_Health_and_Life_Insurance
  type: Reference
  note: Ownership by Discovery Limited, PruHealth/Standard Life Healthcare lineage,
    2014 rebrand, UK's third-largest health insurer, ~1.9M members.
conclusion: |
  built-stub. Vitality UK is an honest partner-gated record. It has a real,
  live, publicly resolvable WSO2 API gateway with a working OAuth2
  client-credentials token endpoint — more API infrastructure than most
  carriers in this data set expose to the open internet — and yet zero
  public documentation, zero machine-readable definitions, zero self-serve
  onboarding and no ACORD posture. The API programme is genuine but its
  audience is commercial partners onboarded through a sales process. From
  the outside, the UK's third-largest health insurer is an unlabelled
  gateway and a 403.
