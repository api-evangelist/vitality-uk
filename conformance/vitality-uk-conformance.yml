    returning RFC 6749 error bodies (invalid_client, invalid_request); authorization
    endpoint returns a 302 to the WSO2 OAuth error page for malformed requests
- id: oidc-core
  name: OpenID Connect Core 1.0
  conforms: true
  evidence: id_token_signing_alg_values_supported RS256, userinfo endpoint,
    claims_supported, subject_types public
- id: oidc-discovery
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: 200 at /oauth2/token/.well-known/openid-configuration and
    /oauth2/oidcdiscovery/.well-known/openid-configuration
